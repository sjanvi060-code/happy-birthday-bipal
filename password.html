<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unlock Our Story ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#0f0f1b;
font-family:'Poppins',sans-serif;
color:white;
}

.box{
text-align:center;
}

input{
padding:15px;
width:250px;
border-radius:10px;
border:none;
margin-top:20px;
font-size:18px;
}

button{
margin-top:20px;

font-size:18px;
cursor:pointer;
}

p{

}

</style>

</head>

<body>

<div class="box">

<h1>🔒 Unlock Our Story</h1>

<p>Hint ❤️<br>The day we officially became us.</p>

<input id="password" placeholder="DDMMYYYY">

<br>

<button onclick="checkPassword()">Unlock ❤️</button>

</div>

<script>

function checkPassword(){

let pass=document.getElementById("password").value;

if(pass==="27042021"){

window.location.href = "story.html";

}else{

alert("Wrong password ❤️");

}

}

</script>

</body>
